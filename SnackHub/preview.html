<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnackHub Email Signature</title>
</head>

<body style="margin:0;padding:0;background:#ffffff;">

    <!-- SnackHub Email Signature : 455px Max -->
    <table cellpadding="0" cellspacing="0" border="0" role="presentation" style="font-family: 'Poppins', Arial, sans-serif; border-collapse:collapse;font-family:Arial,Helvetica,sans-serif;
              max-width:455px;width:455px;">
        <tr>

            <!-- LEFT SIDE -->
            <td valign="top" width="260" style="background:#ffffff;padding:20px 22px 20px 22px;">

                <!-- Name + Title -->
                <div style="font-size:24px;font-weight:700;color:#F9A656;line-height:22px;">
                    Giovanni Correa
                </div>

                <div style="font-size:16px;color:#4F9EBC;line-height:16px;margin-top:4px;">
                    Owner
                </div>

                <!-- Spacer -->
                <div style="height:20px;line-height:20px;font-size:1px;">&nbsp;</div>

                <!-- Phone Row -->
                <table cellpadding="0" cellspacing="0" border="0" role="presentation">
                    <tr>
                        <td width="26">
                            <img src="assets/Phone.png" width="22" height="22" alt="Phone Icon" style="display:block;">
                        </td>
                        <td style="padding-left:6px;">
                            <a href="tel:2103929587" style="font-size:13px;color:#4F9EBC;text-decoration:none;">
                                210-392-9587
                            </a>
                        </td>
                    </tr>
                </table>

                <!-- Spacer -->
                <div style="height:6px;line-height:6px;font-size:1px;">&nbsp;</div>

                <!-- Email Row -->
                <table cellpadding="0" cellspacing="0" border="0" role="presentation">
                    <tr>
                        <td width="26">
                            <img src="assets/Email.png" width="22" height="22" alt="Email Icon" style="display:block;">
                        </td>
                        <td style="padding-left:6px;">
                            <a href="mailto:giovanni16@me.com"
                                style="font-size:13px;color:#4F9EBC;text-decoration:none;">
                                giovanni16@me.com
                            </a>
                        </td>
                    </tr>
                </table>

                <!-- Spacer -->
                <div style="height:20px;line-height:20px;font-size:1px;">&nbsp;</div>

                <!-- Role Chip -->
                <table cellpadding="0" cellspacing="0" role="presentation">
                    <tr>
                        <td style="background:#F9A656;border-radius:999px;padding:7px 22px;text-align:center;">
                            <span style="font-size:12px;font-weight:600;color:#ffffff;">
                                Vending Machines Operator
                            </span>
                        </td>
                    </tr>
                </table>

            </td>

            <!-- RIGHT SIDE (Blue Panel + Logo) -->
            <td valign="top" width="195" align="center" style="padding:0;margin:0;">

                <img src="assets/Right Side.png" width="175" alt="SnackHub Logo Panel"
                    style="display:block;margin:auto;height:auto;">
            </td>

        </tr>
    </table>

</body>

</html>
