<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Email Signature Preview</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body style="font-family: 'Poppins', Arial, sans-serif; margin:0; padding:0; background-color:#ffffff;">
    <!-- signature starts -->
    <table width="455" cellpadding="0" cellspacing="0" border="0" align="left" style="max-width:455px;">
        <tr>
            <td align="center" valign="top" style="padding:0; margin:0;">
                <!-- Inner content table -->
                <table width="100%" cellpadding="0" cellspacing="0" border="0"
                    style="border-collapse:collapse; background-color:#ffffff;">

                    <!-- Top content: name/title + contacts + logo -->
                    <tr>
                        <td align="left" valign="top"
                            style="padding-top:18px; padding-bottom:0; padding-left:22px; padding-right:18px;">
                            <table width="100%" cellpadding="0" cellspacing="0" border="0"
                                style="border-collapse:collapse;">
                                <tr>
                                    <!-- Left column: name, title, phone, email, web -->
                                    <td align="left" valign="top" style="padding:0; margin:0;">

                                        <!-- Name + title -->
                                        <table cellpadding="0" cellspacing="0" border="0">
                                            <tr>
                                                <td
                                                    style="padding:0; margin:0; font-size:20px; font-weight:bold; color:#e1272d;">
                                                    David Guillen-Lopez
                                                </td>
                                            </tr>
                                            <tr>
                                                <td
                                                    style="padding-top:2px; padding-bottom:10px; font-size:11px; color:#666666;">
                                                    CEO
                                                </td>
                                            </tr>
                                        </table>

                                        <!-- Phone / Email / Website (no address here) -->
                                        <table cellpadding="0" cellspacing="0" border="0">
                                            <!-- Phone -->
                                            <tr>
                                                <td align="center" valign="middle"
                                                    style="padding-top:2px; padding-bottom:8px; padding-right:10px;">
                                                    <img src="https://raw.githubusercontent.com/ahsanghafoor/signatures/main/ACM/assets/Mobile.png"
                                                        width="18" alt="Mobile" style="display:block; border:0;">
                                                </td>
                                                <td valign="middle"
                                                    style="padding-top:2px; padding-bottom:8px; font-size:11px; color:#3056a6;">
                                                    <a href="tel:+13853008282"
                                                        style="text-decoration:none; color:#3056a6;">(385) 300-8282</a>
                                                </td>
                                            </tr>
                                            <!-- Email -->
                                            <tr>
                                                <td align="center" valign="middle"
                                                    style="padding-bottom:8px; padding-right:10px;">
                                                    <img src="https://raw.githubusercontent.com/ahsanghafoor/signatures/main/ACM/assets/Phone.png"
                                                        width="18" alt="Phone" style="display:block; border:0;">
                                                </td>
                                                <td valign="middle"
                                                    style="padding-bottom:8px; font-size:11px; color:#3056a6;">
                                                    <a href="tel:+18016641866"
                                                        style="text-decoration:none; color:#3056a6;">
                                                        (801) 664-1866
                                                    </a>
                                                </td>
                                            </tr>
                                            <!-- Website -->
                                            <tr>
                                                <td align="center" valign="middle"
                                                    style="padding-bottom:8px; padding-right:10px;">
                                                    <img src="https://raw.githubusercontent.com/ahsanghafoor/signatures/main/ACM/assets/Globe.png"
                                                        width="18" alt="Website" style="display:block; border:0;">
                                                </td>
                                                <td valign="middle"
                                                    style="padding-bottom:8px; font-size:11px; color:#3056a6;">
                                                    <a href="https://www.acmenviro.com"
                                                        style="text-decoration:none; color:#3056a6;">www.acmenviro.com</a>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>

                                    <!-- Right column: logo -->
                                    <td align="right" valign="top" style="padding-left:10px; padding-top:8px;">
                                        <img src="https://raw.githubusercontent.com/ahsanghafoor/signatures/main/ACM/assets/Logo Design.png"
                                            alt="ACM Environmental"
                                            style="display:block; border:0; max-width:150px; height:auto;">
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Address row spanning full width, visually under same icon, single line -->
                    <tr>
                        <td align="left" valign="top"
                            style="padding-top:0; padding-bottom:1px; padding-left:22px; padding-right:18px;">
                            <table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
                                <tr>
                                    <td align="center" valign="top" style="padding-right:10px;">
                                        <img src="https://raw.githubusercontent.com/ahsanghafoor/signatures/main/ACM/assets/Location.png"
                                            width="18" alt="Location" style="display:block; border:0;">
                                    </td>
                                    <td valign="middle"
                                        style="padding-bottom:8px; font-size:11px; color:#3056a6; line-height:18px; white-space:nowrap;">
                                        25 North 400 West Suite 6 North Salt Lake, Utah 84054
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Bottom bar -->
                    <tr>
                        <td align="left" valign="bottom" style="padding:0; margin:0;">
                            <img src="https://raw.githubusercontent.com/ahsanghafoor/signatures/main/ACM/assets/Bottom.png"
                                alt="Decorative bar" width="455"
                                style="display:block; border:0; max-width:455px; height:auto;">
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
    <!-- signature ends -->



</body>

</html>
