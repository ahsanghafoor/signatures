<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Email Signature – Empowered College Prep</title>
</head>

<body style="margin:0; font-family:'Poppins',Arial,sans-serif;">

    <!--
  ============================================================
  EMAIL SIGNATURE — Empowered College Prep
  Size: 455px wide × 210px tall
  Layout: Table-based, inline CSS only, email-client safe
  ============================================================
-->

    <table border="0" cellpadding="0" cellspacing="0"
        style="width:455px; max-width:455px; height:210px; background-color:#ffffff; border-collapse:collapse; font-family:'Poppins',Arial,sans-serif;">
        <tbody>

            <!-- ═══ ROW 1: TOP STRIP — topRight corner flush to top-right edge ═══ -->
            <tr>
                <td width="190" height="42" valign="top" align="left" style="padding:0; font-size:0; line-height:0;">
                    &nbsp;</td>
                <td valign="top" align="left" style="padding:0; font-size:0; line-height:0;">&nbsp;</td>
                <td width="58" height="42" valign="top" align="right"
                    style="padding:0; font-size:0; line-height:0; vertical-align:top;">
                    <img src="https://raw.githubusercontent.com/ahsanghafoor/signatures/main/ECP/assets/topRight.png"
                        alt="" width="58" height="42" border="0" style="display:block; border:0; outline:none;" />
                </td>
            </tr>

            <!-- ═══ ROW 2: MAIN CONTENT ═══ -->
            <tr>

                <!-- LEFT: Logo centered vertically -->
                <td width="190" valign="middle" align="center" style="padding:0 6px 0 10px; vertical-align:middle;">
                    <img src="https://raw.githubusercontent.com/ahsanghafoor/signatures/main/ECP/assets/logo.png"
                        alt="Empowered College Prep Logo" width="158" height="auto" border="0"
                        style="display:block; border:0; outline:none; margin:0 auto;" />
                </td>

                <!-- RIGHT: Name + Title + Contact (spans remaining 2 cols) -->
                <td colspan="2" valign="middle" align="left" style="padding:0 10px 0 8px; vertical-align:middle;">

                    <table border="0" cellpadding="0" cellspacing="0" style="border-collapse:collapse;">
                        <tbody>

                            <!-- Name -->
                            <tr>
                                <td colspan="2" style="padding:0 0 2px 0; line-height:1;">
                                    <span style="font-family:'Poppins',Arial,sans-serif;
                  font-size:21px; font-weight:bold; color:#1b4f5f;
                  letter-spacing:-0.3px; white-space:nowrap;">
                                        Bonnie Treece
                                    </span>
                                </td>
                            </tr>

                            <!-- Title -->
                            <tr>
                                <td colspan="2" style="padding:0 0 12px 0; line-height:1.2;">
                                    <span style="font-family:'Poppins',Arial,sans-serif;
                  font-size:11px; font-weight:normal; color:#0A98B4;
                  white-space:nowrap;">
                                        College Counselor | SAT/ACT Specialist
                                    </span>
                                </td>
                            </tr>

                            <!-- Phone row -->
                            <tr>
                                <td width="28" valign="middle" style="padding:0 7px 7px 0; vertical-align:middle;">
                                    <img src="https://raw.githubusercontent.com/ahsanghafoor/signatures/main/ECP/assets/phone.png"
                                        alt="Phone" width="22" height="22" border="0"
                                        style="display:block; border:0;" />
                                </td>
                                <td valign="middle" style="padding:0 0 7px 0; vertical-align:middle;">
                                    <a href="tel:8323031830" style="font-family:'Poppins',Arial,sans-serif;
                            font-size:11.5px; color:#0A98B4;
                            text-decoration:none; white-space:nowrap;">
                                        832-303-1830
                                    </a>
                                </td>
                            </tr>

                            <!-- Email row -->
                            <tr>
                                <td width="28" valign="middle" style="padding:0 7px 7px 0; vertical-align:middle;">
                                    <img src="https://raw.githubusercontent.com/ahsanghafoor/signatures/main/ECP/assets/mail.png"
                                        alt="Email" width="22" height="22" border="0"
                                        style="display:block; border:0;" />
                                </td>
                                <td valign="middle" style="padding:0 0 7px 0; vertical-align:middle;">
                                    <a href="mailto:bonnie@empoweredcollegeprep.com" style="font-family:'Poppins',Arial,sans-serif;
                            font-size:11.5px; color:#0A98B4;
                            text-decoration:none; white-space:nowrap;">
                                        bonnie@empoweredcollegeprep.com
                                    </a>
                                </td>
                            </tr>

                            <!-- Website row -->
                            <tr>
                                <td width="28" valign="middle" style="padding:0 7px 0 0; vertical-align:middle;">
                                    <img src="https://raw.githubusercontent.com/ahsanghafoor/signatures/main/ECP/assets/website.png"
                                        alt="Website" width="22" height="22" border="0"
                                        style="display:block; border:0;" />
                                </td>
                                <td valign="middle" style="padding:0; vertical-align:middle;">
                                    <a href="https://www.empoweredcollegeprep.com" style="font-family:'Poppins',Arial,sans-serif;
                            font-size:11.5px; color:#0A98B4;
                            text-decoration:none; white-space:nowrap;">
                                        empoweredcollegeprep.com
                                    </a>
                                </td>
                            </tr>

                        </tbody>
                    </table>

                </td>
            </tr>

            <!-- ═══ ROW 3: BOTTOM STRIP — bottomLeft corner flush to bottom-left edge ═══ -->
            <tr>
                <td width="190" height="42" valign="bottom" align="left"
                    style="padding:0; font-size:0; line-height:0; vertical-align:bottom;">
                    <img src="https://raw.githubusercontent.com/ahsanghafoor/signatures/main/ECP/assets/bottomLeft.png"
                        alt="" width="58" height="42" border="0" style="display:block; border:0; outline:none;" />
                </td>
                <td valign="bottom" align="left" style="padding:0; font-size:0; line-height:0;">&nbsp;</td>
                <td width="58" valign="bottom" align="right" style="padding:0; font-size:0; line-height:0;">&nbsp;</td>
            </tr>

        </tbody>
    </table>

</body>

</html>
