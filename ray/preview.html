<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ray Contreras – Email Signature</title>
</head>

<body style="margin:0;padding:30px;font-family:'Poppins',Arial,sans-serif;">

    <!--
  ╔══════════════════════════════════════════════════╗
  ║  RAY CONTRERAS – EMAIL SIGNATURE                ║
  ║  Size: 455px × 210px                            ║
  ║  Layout:                                         ║
  ║  [Photo.png (bar+photo combined)][Name+Contact][Logos] ║
  ╚══════════════════════════════════════════════════╝
-->

    <table border="0" cellpadding="0" cellspacing="0"
        style="width:455px;max-width:455px;height:210px;border-radius:4px;overflow:hidden;">
        <tr>

            <!-- ─────────────────────────────────────────
         COLUMN A: Combined blue bar + photo image
         Photo.png already has the bar baked in
         Height: 210px, width proportional
    ───────────────────────────────────────────── -->
            <td width="130" height="210" style="width:130px;height:210px;padding:0;vertical-align:top;">
                <img src="https://raw.githubusercontent.com/ahsanghafoor/signatures/main/ray/assets/Photo.png"
                    alt="Ray Contreras" width="130" height="210" style="display:block;width:130px;height:210px;" />
            </td>

            <!-- ─────────────────────────────────────────
         COLUMN B: Name, Title & Contact Details
         Width: 235px
    ───────────────────────────────────────────── -->
            <td width="235" height="210" style="width:235px;height:210px;vertical-align:middle;
               
               padding-left:15px;padding-right:4px;">

                <table border="0" cellpadding="0" cellspacing="0" width="216">

                    <!-- NAME -->
                    <tr>
                        <td style="padding-bottom:1px;">
                            <span style="font-family:'Poppins',Arial,sans-serif;
                         font-size:20px;
                         font-weight:700;
                         color:#1b3a9b;
                         letter-spacing:1px;
                         line-height:1;
                         white-space:nowrap;
                         display:block;">RAY CONTRERAS</span>
                        </td>
                    </tr>

                    <!-- TITLE -->
                    <tr>
                        <td style="padding-bottom:13px;">
                            <span style="font-family:'Poppins',Arial,sans-serif;
                         font-size:9px;
                         font-weight:400;
                         color:#4970B3;
                         letter-spacing:0.3px;
                         display:block;">Real Estate Agent &amp; Consultant</span>
                        </td>
                    </tr>

                    <!-- PHONE ROW -->
                    <tr>
                        <td style="padding-bottom:5px;">
                            <table border="0" cellpadding="0" cellspacing="0">
                                <tr>
                                    <td width="24" valign="middle"
                                        style="width:24px;vertical-align:middle;padding-right:7px;">
                                        <img src="https://raw.githubusercontent.com/ahsanghafoor/signatures/main/ray/assets/Phone.png"
                                            alt="Phone" width="17" height="17"
                                            style="display:block;width:17px;height:17px;" />
                                    </td>
                                    <td valign="middle" style="vertical-align:middle;line-height:1;">
                                        <a href="tel:6466207763" style="font-family:'Poppins',Arial,sans-serif;
                            font-size:10.5px;
                            color:#4970B3;
                            text-decoration:none;
                            font-weight:400;
                            display:block;">646-620-7763</a>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- EMAIL ROW -->
                    <tr>
                        <td style="padding-bottom:5px;">
                            <table border="0" cellpadding="0" cellspacing="0">
                                <tr>
                                    <td width="24" valign="middle"
                                        style="width:24px;vertical-align:middle;padding-right:7px;">
                                        <img src="https://raw.githubusercontent.com/ahsanghafoor/signatures/main/ray/assets/mail.png"
                                            alt="Email" width="17" height="17"
                                            style="display:block;width:17px;height:17px;" />
                                    </td>
                                    <td valign="middle" style="vertical-align:middle;line-height:1;">
                                        <a href="mailto:Finehomes123@gmail.com" style="font-family:'Poppins',Arial,sans-serif;
                            font-size:10.5px;
                            color:#4970B3;
                            text-decoration:none;
                            font-weight:400;
                            display:block;">Finehomes123@gmail.com</a>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- ADDRESS / WEBSITE ICON ROW -->
                    <tr>
                        <td style="padding-bottom:0;">
                            <table border="0" cellpadding="0" cellspacing="0">
                                <tr>
                                    <td width="24" valign="middle"
                                        style="width:24px;vertical-align:middle;padding-right:7px;">
                                        <img src="https://raw.githubusercontent.com/ahsanghafoor/signatures/main/ray/assets/Website.png"
                                            alt="Address" width="17" height="17"
                                            style="display:block;width:17px;height:17px;" />
                                    </td>
                                    <td valign="middle" style="vertical-align:middle;line-height:1;">
                                        <span style="font-family:'Poppins',Arial,sans-serif;
                               font-size:10.5px;
                               color:#4970B3;
                               font-weight:400;
                               display:block;">
                                            2201 W Prospect Rd Ste 200, Fort Lauderdale, FL 33309
                                        </span>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                </table>
            </td>

            <!-- ─────────────────────────────────────────
         COLUMN C: Logos
         Width: 90px
         Top: CRR United Realty logo
         Bottom: REALTOR® logo
    ───────────────────────────────────────────── -->
            <td width="90" height="210" style="width:90px;height:210px;vertical-align:top;padding:0;text-align:center;">

                <table border="0" cellpadding="0" cellspacing="0" width="90" height="210"
                    style="width:90px;height:210px;">
                    <!-- CRR LOGO – upper area -->
                    <tr>
                        <td align="center" valign="top"
                            style="padding-top:18px;padding-bottom:0;padding-left:2px;padding-right:8px;">
                            <img src="https://raw.githubusercontent.com/ahsanghafoor/signatures/main/ray/assets/Logo.png"
                                alt="CRR United Realty" width="76"
                                style="display:block;width:90px;height:auto;margin:0 auto;" />
                        </td>
                    </tr>
                    <!-- SPACER between logos -->
                    <tr>
                        <td height="36" style="height:36px;">&nbsp;</td>
                    </tr>
                    <!-- REALTOR LOGO – lower area -->
                    <tr>
                        <td align="center" valign="bottom"
                            style="padding-bottom:18px;padding-left:2px;padding-right:8px;">
                            <img src="https://raw.githubusercontent.com/ahsanghafoor/signatures/main/ray/assets/Realotor.png"
                                alt="REALTOR®" width="56" style="display:block;width:40px;height:auto;margin:0 auto;" />
                        </td>
                    </tr>
                </table>

            </td>

        </tr>
    </table>

</body>

</html>
