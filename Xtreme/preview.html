<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Xtreme Staffing Email Signature</title>
</head>

<body style="margin:0;padding:0;background:#ffffff;"><!--[if (gte mso 9)|(IE)]>
<table role="presentation" border="0" cellpadding="0" cellspacing="0" width="455" style="width:455px;">
<tr>
<td>
<![endif]-->
    <table role="presentation" border="0" cellpadding="0" cellspacing="0" align="left"
        style="width:455px;max-width:455px; font-family: 'Poppins', Arial, sans-serif;background-color:#000000;border-collapse:collapse;font-family:'Poppins',Arial,Helvetica,sans-serif;margin:0;padding:0;border-spacing:0;">

        <!-- TOP ROW: Left bar (rowspan) + Top decorative bar -->
        <tr>
            <!-- LEFT VERTICAL BAR - spans all 3 rows -->
            <td rowspan="3" valign="top" style="width:42px;padding:0;margin:0;line-height:0;font-size:0;">
                <img src="https://raw.githubusercontent.com/ahsanghafoor/signatures/main/Xtreme/assets/Left Side Bar.png"
                    alt=""
                    style="display:block;border:0;outline:none;text-decoration:none;width:42px;height:261px;margin:0;padding:0;">
            </td>

            <!-- TOP BAR -->
            <td style="padding:0;line-height:0;font-size:0;text-align:right;">
                <img src="https://raw.githubusercontent.com/ahsanghafoor/signatures/main/Xtreme/assets/Top Bar .png"
                    alt="" width="200" height="32"
                    style="display:inline-block;border:0;outline:none;text-decoration:none;width:200px;height:32px;vertical-align:bottom;">
            </td>
        </tr>

        <!-- MIDDLE ROW: Main content -->
        <tr>
            <td style="padding:0;">
                <table role="presentation" border="0" cellpadding="0" cellspacing="0"
                    style="width:100%;border-collapse:collapse;">

                    <!-- NAME ROW (TOP) -->
                    <tr>
                        <!-- NAME + TITLE -->
                        <td valign="top" style="width:210px;padding:8px 0 0 18px;">
                            <table role="presentation" border="0" cellpadding="0" cellspacing="0"
                                style="border-collapse:collapse;">
                                <tr>
                                    <td
                                        style="font-size:20px;line-height:20px;font-weight:700;color:#F03434;padding:0 0 4px 0;">
                                        Chauntel RB Morris
                                    </td>
                                </tr>
                                <tr>
                                    <td
                                        style="font-size:14px;line-height:20px;font-weight:400;color:#FFFFFF;padding:0;">
                                        Director of Operations
                                    </td>
                                </tr>
                            </table>
                        </td>

                        <!-- SPACER BETWEEN TEXT & LOGO -->
                        <td style="width:12px;font-size:0;line-height:0;">&nbsp;</td>

                        <!-- LOGO BLOCK (CENTERED VERTICALLY - spans all 3 rows) -->
                        <td rowspan="3" valign="middle" align="center" style="width:173px;padding:0 16px 0 0;">
                            <img src="https://raw.githubusercontent.com/ahsanghafoor/signatures/main/Xtreme/assets/Logo.png"
                                alt="Xtreme Staffing"
                                style="display:block;border:0;outline:none;text-decoration:none;width:170px;height:auto;">
                        </td>
                    </tr>

                    <!-- SPACER ROW (GAP BETWEEN NAME AND CONTACTS) -->
                    <tr>
                        <td colspan="2" style="height:40px;font-size:0;line-height:0;">&nbsp;</td>
                    </tr>

                    <!-- CONTACT INFO ROW (BOTTOM) -->
                    <tr>
                        <!-- CONTACT LINES -->
                        <td valign="bottom" style="width:210px;padding:0 0 0 18px;">
                            <table role="presentation" border="0" cellpadding="0" cellspacing="0"
                                style="border-collapse:collapse;">

                                <!-- PHONE -->
                                <tr>
                                    <td valign="middle" style="width:30px;padding:0 8px 0 0;">
                                        <img src="https://raw.githubusercontent.com/ahsanghafoor/signatures/main/Xtreme/assets/Phone Icon.png"
                                            alt="Phone" width="30" height="30"
                                            style="display:block;border:0;outline:none;text-decoration:none;width:35px;height:35px;">
                                    </td>
                                    <td valign="middle"
                                        style="font-size:12px;line-height:30px;color:#FFFFFF;padding:0;white-space:nowrap;">
                                        <a href="tel:14048155085"
                                            style="color:#FFFFFF;text-decoration:none;">404-815-5085</a>
                                    </td>
                                </tr>

                                <!-- EMAIL -->
                                <tr>
                                    <td valign="middle" style="width:30px;padding:0 8px 0 0;">
                                        <img src="https://raw.githubusercontent.com/ahsanghafoor/signatures/main/Xtreme/assets/E-Mail Icon.png"
                                            alt="Email" width="30" height="30"
                                            style="display:block;border:0;outline:none;text-decoration:none;width:35px;height:35px;">
                                    </td>
                                    <td valign="middle"
                                        style="font-size:12px;line-height:30px;color:#FFFFFF;padding:0;white-space:nowrap;">
                                        <a href="mailto:Cmorris@extremestaffing.com"
                                            style="color:#FFFFFF;text-decoration:none;">Cmorris@extremestaffing.com</a>
                                    </td>
                                </tr>

                                <!-- WEBSITE -->
                                <tr>
                                    <td valign="middle" style="width:30px;padding:0 8px 0 0;">
                                        <img src="https://raw.githubusercontent.com/ahsanghafoor/signatures/main/Xtreme/assets/Globe Icon.png"
                                            alt="Website" width="30" height="30"
                                            style="display:block;border:0;outline:none;text-decoration:none;width:35px;height:35px;">
                                    </td>
                                    <td valign="middle"
                                        style="font-size:12px;line-height:30px;color:#FFFFFF;padding:0;white-space:nowrap;">
                                        <a href="https://www.extremestaffing.com"
                                            style="color:#FFFFFF;text-decoration:none;">www.extremestaffing.com</a>
                                    </td>
                                </tr>
                            </table>
                        </td>

                        <!-- SPACER -->
                        <td style="width:12px;font-size:0;line-height:0;">&nbsp;</td>
                    </tr>
                </table>
            </td>
        </tr>

        <!-- BOTTOM ROW: Bottom decorative bar -->
        <tr>
            <td style="padding:0;line-height:0;font-size:0;text-align:right;">
                <img src="https://raw.githubusercontent.com/ahsanghafoor/signatures/main/Xtreme/assets/Bottom Bar.png"
                    alt="" width="200" height="32"
                    style="display:inline-block;border:0;outline:none;text-decoration:none;width:200px;height:32px;vertical-align:bottom;">
            </td>
        </tr>
    </table>

    <!--[if (gte mso 9)|(IE)]>
            </td>
        </tr>
