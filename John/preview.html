<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>John Baley – Email Signature</title>
</head>

<body style="margin:0;padding:0;">

    <table width="455" cellpadding="0" cellspacing="0" border="0"
        style="width:455px;height:210px;background:#ffffff;border-collapse:collapse;mso-table-lspace:0pt;mso-table-rspace:0pt;">

        <!-- ROW 1 · content area 188px -->
        <tr>

            <!-- LEFT COLUMN: Name+Title top · Phone+Email bottom -->
            <td width="272" style="width:272px;padding:0;vertical-align:top;">
                <table width="272" cellpadding="0" cellspacing="0" border="0"
                    style="width:272px;height:188px;border-collapse:collapse;">

                    <!-- ① Top block: Name + Psychologist line -->
                    <tr>
                        <td style="padding:20px 0 0 26px;vertical-align:top;height:1px;white-space:nowrap;">

                            <!-- Name -->
                            <div
                                style="font-family: 'Poppins', Arial, sans-serif;font-size:25px;font-weight:700;color:#111111;line-height:1.15;letter-spacing:-0.4px;white-space:nowrap;margin:0;padding:0;">
                                John&nbsp;Baley&nbsp;Attorney
                            </div>

                            <!-- Psychologist + underline that stretches right -->
                            <table cellpadding="0" cellspacing="0" border="0"
                                style="border-collapse:collapse;margin-top:5px;width:216px;">
                                <tr>
                                    <td
                                        style="font-family: 'Poppins', Arial, sans-serif;font-size:14px;font-weight:500;color:#111111;white-space:nowrap;padding:0;vertical-align:bottom;line-height:1.2;">
                                        Psychologist</td>
                                    <td style="border-bottom:2px solid #111111;width:100%;padding:0 0 1px 0;">&nbsp;
                                    </td>
                                </tr>
                            </table>

                        </td>
                    </tr>

                    <!-- ② Elastic spacer -->
                    <tr>
                        <td style="padding:0;font-size:0;line-height:0;">&nbsp;</td>
                    </tr>

                    <!-- ③ Bottom block: Phone + Email -->
                    <tr>
                        <td style="padding:0 0 12px 26px;vertical-align:bottom;height:1px;">

                            <!-- Phone -->
                            <table cellpadding="0" cellspacing="0" border="0"
                                style="border-collapse:collapse;margin-bottom:8px;">
                                <tr>
                                    <td style="vertical-align:middle;padding-right:9px;line-height:0;font-size:0;">
                                        <img src="https://raw.githubusercontent.com/ahsanghafoor/signatures/main/John/assets/Phone.png"
                                            width="17" height="17" alt="Phone"
                                            style="display:block;width:17px;height:17px;">
                                    </td>
                                    <td
                                        style="font-family: 'Poppins', Arial, sans-serif;font-size:14px;font-weight:500;color:#111111;vertical-align:middle;white-space:nowrap;line-height:1;padding:0;">
                                        <a href="tel:828-423-0777"
                                            style="color:#111111; text-decoration:none;">828-423-0777</a>
                                    </td>
                                </tr>
                            </table>

                            <!-- Email -->
                            <table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
                                <tr>
                                    <td style="vertical-align:middle;padding-right:9px;line-height:0;font-size:0;">
                                        <img src="https://raw.githubusercontent.com/ahsanghafoor/signatures/main/John/assets/Email.png"
                                            width="17" height="13" alt="Email"
                                            style="display:block;width:17px;height:13px;">
                                    </td>
                                    <td
                                        style="font-family: 'Poppins', Arial, sans-serif;font-size:14px;font-weight:500;color:#111111;vertical-align:middle;white-space:nowrap;line-height:1;padding:0;">
                                        <a href="mailto:admin@lawavl.com"
                                            style="color:#111111; text-decoration:none;">admin@lawavl.com</a>
                                    </td>
                                </tr>
                            </table>

                        </td>
                    </tr>

                </table>
            </td>
            <!-- /LEFT COLUMN -->

            <!-- RIGHT COLUMN: photo bottom-aligned -->
            <td width="183" style="width:183px;vertical-align:bottom;text-align:center;padding:0 12px 5px 0;">
                <img src="https://raw.githubusercontent.com/ahsanghafoor/signatures/main/John/assets/Pic.png"
                    width="130" height="130" alt="John Baley"
                    style="display:block;margin:0 auto;width:130px;height:130px;">
            </td>
            <!-- /RIGHT COLUMN -->

        </tr>
        <!-- /ROW 1 -->

        <!-- ROW 2 · black bottom bar 22px -->
        <tr>
            <td colspan="2" height="22" style="height:22px;padding:0;font-size:0;line-height:0;">
                <img src="https://raw.githubusercontent.com/ahsanghafoor/signatures/main/John/assets/BottomBar.png"
                    width="455" height="22" alt="" style="display:block;width:455px;height:22px;">
            </td>
        </tr>
        <!-- /ROW 2 -->

    </table>

</body>

</html>
