<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Signature</title>
</head>

<body style="margin:0; padding:0;font-family: 'Poppins', Arial, sans-serif;">
    <!-- signature starts -->
    <table border="0" cellpadding="0" cellspacing="0" align="left"
        style="width:455px; max-width:455px; height:300px; max-height:300px;">
        <tr>
            <!-- Left block -->
            <td valign="middle" align="center" style="width:185px; padding-top:10px; padding-bottom:10px;">
                <table border="0" cellpadding="0" cellspacing="0" align="center" style="width:185px;">
                    <tr>
                        <td align="center" style="padding-bottom:10px;">
                            <img src="https://raw.githubusercontent.com/ahsanghafoor/signatures/main/Innovation/assets/logo.png"
                                width="220" alt="Willis Innovations LLC Logo" border="0"
                                style="display:block; width:220px; height:auto;">
                        </td>
                    </tr>
                </table>
            </td>

            <!-- Divider -->
            <td valign="middle" align="center" style="width:20px;">
                <img src="https://raw.githubusercontent.com/ahsanghafoor/signatures/main/Innovation/assets/seperation-line.png"
                    width="2" alt="Divider" border="0"
                    style="display:block; width:2px; height:200px; padding-left:25px; padding-right:25px">
            </td>

            <!-- Right block -->
            <td valign="middle" align="left" style="width:250px; padding-top:10px; padding-bottom:10px;">
                <table border="0" cellpadding="0" cellspacing="0" align="left" style="width:250px;">
                    <tr>
                        <td align="left" style="padding-bottom:4px;">
                            <img src="https://raw.githubusercontent.com/ahsanghafoor/signatures/main/Innovation/assets/title.png"
                                width="220">
                            <!-- <span style="  font-size:30px; line-height:34px;
                                font-weight:700; color:#2e6fa7;">
                                Preston D. Willis</span> -->
                        </td>
                    </tr>
                    <tr>
                        <td align="left" style="padding-bottom:14px;">
                            <span style=" font-size:18px; line-height:22px; font-weight:400; color:#787878;">Founder
                                &amp; Principal</span>
                        </td>
                    </tr>

                    <!-- Phone -->
                    <tr>
                        <td align="left" style="padding-bottom:10px;">
                            <table border="0" cellpadding="0" cellspacing="0" align="left">
                                <tr>
                                    <td valign="middle" style="padding-right:10px;">
                                        <img src="https://raw.githubusercontent.com/ahsanghafoor/signatures/main/Innovation/assets/phone-icon.png"
                                            width="34" alt="Phone" border="0"
                                            style="display:block; width:28px; height:28px;">
                                    </td>
                                    <td valign="middle" align="left">
                                        <a href="tel:+17065709832"
                                            style=" font-size:18px; line-height:22px; font-weight:400; color:#787878; text-decoration:none;">
                                            (706) 570-9832
                                        </a>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Email -->
                    <tr>
                        <td align="left" style="padding-bottom:10px;">
                            <table border="0" cellpadding="0" cellspacing="0" align="left">
                                <tr>
                                    <td valign="middle" style="padding-right:10px;">
                                        <img src="https://raw.githubusercontent.com/ahsanghafoor/signatures/main/Innovation/assets/Asset 2.png"
                                            width="34" alt="Email" border="0"
                                            style="display:block; width:28px; height:28px;">
                                    </td>
                                    <td valign="middle" align="left">
                                        <a href="mailto:Preston@WillisInnovations.com"
                                            style=" font-size:18px; line-height:22px; font-weight:400; color:#787878; text-decoration:none;">
                                            Preston@WillisInnovations.com
                                        </a>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Website -->
                    <tr>
                        <td align="left">
                            <table border="0" cellpadding="0" cellspacing="0" align="left">
                                <tr>
                                    <td valign="middle" style="padding-right:10px;">
                                        <img src="https://raw.githubusercontent.com/ahsanghafoor/signatures/main/Innovation/assets/world-icon.png"
                                            width="34" alt="Website" border="0"
                                            style="display:block; width:28px; height:28px;">
                                    </td>
                                    <td valign="middle" align="left">
                                        <a href="https://WillisInnovations.com"
                                            style=" font-size:18px; line-height:22px; font-weight:400; color:#787878; text-decoration:none;">
                                            WillisInnovations.com
                                        </a>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
    <!-- signature ends -->



</body>

</html>
