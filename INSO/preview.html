<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Email Signature Preview</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body style="font-family: 'Poppins', Arial, sans-serif; margin:0; padding:0; background-color:#ffffff;">
    <!--
  Email signature (455x210)
  Font: Poppins (email clients may fall back to Arial/Helvetica if web fonts are blocked)
  Replace the image src values with hosted HTTPS URLs (recommended), or CID URLs if your email client supports it.
-->

    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="455" height="210" style="
    width:455px;
    height:210px;
    background:#000000;
    border-collapse:collapse;
    mso-table-lspace:0pt;
    mso-table-rspace:0pt;
    font-family:Poppins, Arial, Helvetica, sans-serif;
  ">
        <tr>
            <td style="padding:18px 18px 0 18px; vertical-align:top;">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"
                    style="border-collapse:collapse;">
                    <tr>
                        <!-- Left: Photo -->
                        <td width="120" style="width:120px; vertical-align:top;">
                            <!-- Use your pre-made circular image asset -->
                            <img src="https://raw.githubusercontent.com/ahsanghafoor/signatures/main/INSO/assets/Picture.png"
                                width="110" height="110" alt="Profile"
                                style="display:block; border:0; outline:none; text-decoration:none;" />
                        </td>

                        <!-- Right: Logo -->
                        <td style="vertical-align:top; text-align:right; padding-top: 20px; padding-right: 20px;">
                            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="160"
                                align="right" style="border-collapse:collapse; width:160px;">
                                <tr>
                                    <td align="center" style="padding-bottom:6px;">
                                        <img src="https://raw.githubusercontent.com/ahsanghafoor/signatures/main/INSO/assets/Logo.png"
                                            width="160" alt="inso3nergy"
                                            style="display:block; border:0; outline:none; text-decoration:none;" />
                                    </td>
                                </tr>
                                <tr>
                                    <td align="center"
                                        style="color:#ffffff; font-size:12px; line-height:14px; font-weight:400;">
                                        PUCT#: BR210219
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Name -->
                    <tr>
                        <td colspan="2" style="padding-top:15px;">
                            <div style="
                color:#C7FF00;
                font-size:34px;
                line-height:36px;
                font-weight:700;
                letter-spacing:0.2px;
              ">
                                Eric H. Haggerton
                            </div>
                        </td>
                    </tr>

                    <!-- Title -->
                    <tr>
                        <td colspan="2" style="padding-top:10px;">
                            <div style="
                color:#FFFFFF;
                font-size:15px;
                line-height:18px;
                font-weight:400;
                opacity:0.95;
                white-space:nowrap;
              ">
                                Founder/Broker&nbsp;-&nbsp;Power&nbsp;Broker&nbsp;-&nbsp;Energy&nbsp;Broker&nbsp;-&nbsp;Efficiency&nbsp;Consultant
                            </div>

                        </td>
                    </tr>

                    <!-- Divider line (your asset) -->
                    <tr>
                        <td colspan="2" style="padding-top:12px;">
                            <img src="https://raw.githubusercontent.com/ahsanghafoor/signatures/main/INSO/assets/Line.png"
                                width="419" height="8" alt=""
                                style="display:block; border:0; outline:none; text-decoration:none;" />
                        </td>
                    </tr>

                    <!-- Contact row -->
                    <tr>
                        <td colspan="2" style="padding-top:20px; text-align:center;">
                            <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center"
                                style="border-collapse:collapse; margin:0 auto;">
                                <tr>
                                    <!-- Phone -->
                                    <td style="vertical-align:middle; padding-right:8px;">
                                        <a href="tel:+12146244024"
                                            style="text-decoration:none; display:block; line-height:0;">
                                            <img src="https://raw.githubusercontent.com/ahsanghafoor/signatures/main/INSO/assets/Phone.png"
                                                width="26" height="26" alt="Phone"
                                                style="display:block; border:0; vertical-align:middle;" />
                                        </a>
                                    </td>
                                    <td
                                        style="vertical-align:middle; color:#FFFFFF; font-size:15px; line-height:26px; padding-right:18px; white-space:nowrap;">
                                        <a href="tel:+12146244024"
                                            style="color:#FFFFFF; text-decoration:none; white-space:nowrap;">214&#8209;624&#8209;4024</a>
                                    </td>

                                    <!-- Email -->
                                    <td style="vertical-align:middle; padding-right:8px;">
                                        <a href="mailto:eric@insoenergy.com"
                                            style="text-decoration:none; display:block; line-height:0;">
                                            <img src="https://raw.githubusercontent.com/ahsanghafoor/signatures/main/INSO/assets/Envelope.png"
                                                width="26" height="26" alt="Email"
                                                style="display:block; border:0; vertical-align:middle;" />
                                        </a>
                                    </td>
                                    <td
                                        style="vertical-align:middle; color:#FFFFFF; font-size:15px; line-height:26px; padding-right:18px; white-space:nowrap;">
                                        <a href="mailto:eric@insoenergy.com"
                                            style="color:#FFFFFF; text-decoration:none;">eric@insoenergy.com</a>
                                    </td>

                                    <!-- Location -->
                                    <td style="vertical-align:middle; padding-right:8px;">
                                        <img src="https://raw.githubusercontent.com/ahsanghafoor/signatures/main/INSO/assets/Location.png"
                                            width="26" height="26" alt="Location"
                                            style="display:block; border:0; vertical-align:middle;" />
                                    </td>
                                    <td
                                        style="vertical-align:middle; color:#FFFFFF; font-size:15px; line-height:26px; white-space:nowrap;">
                                        Frisco,&nbsp;Texas
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Bottom spacing to keep total height neat -->
                    <tr>
                        <td colspan="2" style="height:15px; line-height:15px; font-size:0;">
                            &nbsp;
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>



</body>

</html>
