<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Email Signature Preview</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body style="font-family: 'Poppins', Arial, sans-serif; margin:0; padding:0; background-color:#ffffff;">
    <!--
  Email signature (455x210)
  Font: Poppins (email clients may fall back to Arial/Helvetica if web fonts are blocked)
  Replace the image src values with hosted HTTPS URLs (recommended), or CID URLs if your email client supports it.
-->

    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="455" height="210" style="
    width:455px;
    height:210px;
    background:#000000;
    border-collapse:collapse;
    mso-table-lspace:0pt;
    mso-table-rspace:0pt;
    font-family:Poppins, Arial, Helvetica, sans-serif;
  ">
        <tr>
            <td style="padding:18px 18px 0 18px; vertical-align:top;">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"
                    style="border-collapse:collapse;">
                    <tr>
                        <!-- Left: Photo -->
                        <td width="120" style="width:120px; vertical-align:top;">
                            <!-- Use your pre-made circular image asset -->
                            <img src="assets/Picture.png" width="110" height="110" alt="Profile"
                                style="display:block; border:0; outline:none; text-decoration:none;" />
                        </td>

                        <!-- Right: Logo -->
                        <td style="vertical-align:top; text-align:right; padding-top: 20px; padding-right: 20px;">
                            <img src="assets/Logo.png" width="160" alt="inso3nergy"
                                style="display:inline-block; border:0; outline:none; text-decoration:none;" />
                        </td>
                    </tr>

                    <!-- Name -->
                    <tr>
                        <td colspan="2" style="padding-top:15px;">
                            <div style="
                color:#C7FF00;
                font-size:34px;
                line-height:36px;
                font-weight:700;
                letter-spacing:0.2px;
              ">
                                Eric H. Haggerton
                            </div>
                        </td>
                    </tr>

                    <!-- Title -->
                    <tr>
                        <td colspan="2" style="padding-top:10px;">
                            <div style="
                color:#FFFFFF;
                font-size:15px;
                line-height:18px;
                font-weight:400;
                opacity:0.95;
              ">
                                Founder/Broker - Power Broker - Energy Broker - Efficiency Consultant
                            </div>
                        </td>
                    </tr>

                    <!-- Divider line (your asset) -->
                    <tr>
                        <td colspan="2" style="padding-top:12px;">
                            <img src="assets/Line.png" width="419" height="8" alt=""
                                style="display:block; border:0; outline:none; text-decoration:none;" />
                        </td>
                    </tr>

                    <!-- Contact row -->
                    <tr>
                        <td colspan="2" style="padding-top:20px;">
                            <table role="presentation" cellpadding="0" cellspacing="0" border="0"
                                style="border-collapse:collapse;">
                                <tr>
                                    <!-- Phone -->
                                    <td style="vertical-align:middle; padding-right:10px;">
                                        <a href="tel:+12146244024" style="text-decoration:none; display:inline-block;">
                                            <img src="assets/Phone.png" width="26" height="26" alt="Phone"
                                                style="display:block; border:0;" />
                                        </a>
                                    </td>
                                    <td style="
                    vertical-align:middle;
                    color:#FFFFFF;
                    font-size:15px;
                    line-height:20px;
                    padding-right:18px;
                    white-space:nowrap;
                  ">
                                        <a href="tel:+12146244024"
                                            style="color:#FFFFFF; text-decoration:none;">214-624-4024</a>
                                    </td>

                                    <!-- Email -->
                                    <td style="vertical-align:middle; padding-right:10px;">
                                        <a href="mailto:eric@insoenergy.com"
                                            style="text-decoration:none; display:inline-block;">
                                            <img src="assets/Envelope.png" width="26" height="26" alt="Email"
                                                style="display:block; border:0;" />
                                        </a>
                                    </td>
                                    <td style="
                    vertical-align:middle;
                    color:#FFFFFF;
                    font-size:15px;
                    line-height:20px;
                    padding-right:18px;
                    white-space:nowrap;
                  ">
                                        <a href="mailto:eric@insoenergy.com"
                                            style="color:#FFFFFF; text-decoration:none;">eric@insoenergy.com</a>
                                    </td>

                                    <!-- Location -->
                                    <td style="vertical-align:middle; padding-right:10px;">
                                        <img src="assets/Location.png" width="26" height="26" alt="Location"
                                            style="display:block; border:0;" />
                                    </td>
                                    <td style="
                    vertical-align:middle;
                    color:#FFFFFF;
                    font-size:15px;
                    padding-right: 100px;
                    line-height:20px;
                    white-space:nowrap;
                  ">
                                        Frisco, Texas
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Bottom spacing to keep total height neat -->
                    <tr>
                        <td colspan="2" style="height:15px; line-height:15px; font-size:0;">
                            &nbsp;
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>



</body>

</html>
